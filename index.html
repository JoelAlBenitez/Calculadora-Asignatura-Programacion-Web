<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/style.css">
    <script src="/js/script.js" defer></script>
    <title>Asignación 2: Calculadora | Programación Web</title>
</head>
<body>

    <div class="container">
    
        <div class="calculate">
        
        <div class="windows-container">
            <input readonly type="text"  id="mirrorWindows">
            <input placeholder="0"   readonly type="text" maxlength="16" id="window">
        </div> 
       
        <div class="group-numbers">
            <div class="btn-group-number">
                <button class="btn-operatorNumber" value="CE">CE</button>
                <button class="btn-operatorNumber" value="C">C</button>
            </div>
            <div class="btn-point" >
            <button id="btn-point" value=".">.</button>
            </div>
            <div class="btn-group-number">
                <button class="btn-number" value="1">1</button>
                <button class="btn-number" value="2">2</button>
               
            </div>  
    
            <div class="btn-group-number">
                 <button class="btn-number" value="3">3</button>
                <button class="btn-number" value="4">4</button>           
            </div>
            <div class="btn-group-number">
                <button class="btn-number" value="5">5</button>
                <button class="btn-number" value="6">6</button>           
            </div>

            <div class="btn-group-number">
                <button class="btn-number" value="7">7</button>
                <button class="btn-number" value="8">8</button>
              
            </div>
             <div class="btn-group-number">
                <button class="btn-number" value="9">9</button>
                <button class="btn-number" value="0">0</button>
            </div>
        </div>
       
        <div class="group-operators">
            <button id="x-digit" value="x">< X</button>
            <button class="btn-operator" value="+">+</button>
            <button class="btn-operator" value="-">-</button>
            <button class="btn-operator" value="*">*</button>
            <button class="btn-operator" value="/">/</button>
            <button id="result-operator" value="=" >=</button>
        </div>


    </div>

     <div class="calculate-history" id="field">
        
        <h4>Historial</h4>
        <div class="history" id="field-history"></div>
        <i id="grabarge-history" class="bi bi-trash3"></i>
     </div>
    </div>

</body>
</html>
